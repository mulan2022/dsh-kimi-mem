# Kimi-compatible canonical section schema. Legacy file/name definitions still work.
# inject_char_cap is a consolidation target; injectMaxChars controls runtime injection.
inject_char_cap: 6000
sections:
  - path: sections/personal_context.md
    title: Personal Context
  - path: sections/work_context.md
    title: Work Context
  - path: sections/this_month.md
    title: This Month
    window: current-month
  - path: sections/earlier_months.md
    title: Earlier Months
    window: month-archive
  - path: sections/taste.md
    title: Taste & Preferences
  - path: sections/memory_tips.md
    title: Memory Tips
